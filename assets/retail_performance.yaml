name: RETAIL_PERFORMANCE_DRAFT
description: Draft semantic model to measure Retail store performance
tables:
- name: DIM_CUSTOMER_RETAIL_STORE_VW
  base_table:
    database: EDP_PROD
    schema: PRES
    table: '"Dim_Customer_Retail_Store_VW"'
  dimensions:
  - name: BANNER_GROUP_NAME
    synonyms:
    - banner_group
    - group_name
    - store_group
    - retail_group
    - store_banner
    description: The name of the retail store's banner group, which represents a grouping
      of retail stores under a common brand or marketing identity.
    expr: '"Banner Group Name"'
    data_type: VARCHAR(50)
  - name: CUSTOMER_RETAIL_STORE_KEY
    synonyms:
    - retail_store_id
    - store_key
    - customer_store_identifier
    - retail_store_identifier
    - store_unique_key
    description: Unique identifier for a retail store where a customer made a purchase.
    expr: '"Customer Retail Store Key"'
    data_type: NUMBER(38,0)
  - name: IS_POS_FLAG
    synonyms:
    - is_pos_consent
    - pos_consent_flag
    - point_of_sale_flag
    - is_pos_enabled
    - pos_status
    description: Indicates whether the customer is a point of sale (POS) customer,
      with possible values of 'YES' or 'NO'.
    expr: '"Is POS Flag"'
    data_type: VARCHAR(3)
  - name: POS_SOFTWARE_NAME
    synonyms:
    - point_of_sale_software_name
    - pos_system_name
    - retail_software_name
    - store_software_name
    - transaction_software_name
    description: The name of the point-of-sale (POS) software used by the retail store.
    expr: '"POS Software Name"'
    data_type: VARCHAR(50)
  - name: SITE_LINK_CODE
    synonyms:
    - site_code
    - location_code
    - store_link_id
    - site_identifier
    - location_identifier
    description: Unique identifier for the retail store location.
    expr: '"Site Link Code"'
    data_type: VARCHAR(500)
  - name: STATE_CODE
    synonyms:
    - state_abbreviation
    - state_id
    - region_code
    - province_code
    - territory_code
    - geographic_code
    description: The two-character code representing the state where the retail store
      is located.
    expr: '"State Code"'
    data_type: VARCHAR(50)
  - name: STORE_CODE
    synonyms:
    - store_id_number
    - store_identifier
    - retail_store_code
    - outlet_code
    - location_code
    description: Unique identifier for the retail store where the customer made a
      purchase.
    expr: '"Store Code"'
    data_type: VARCHAR(50)
  - name: STORE_NAME
    synonyms:
    - store_title
    - retail_store_name
    - shop_name
    - outlet_name
    - store_identity
    - retail_outlet_name
    - store_designation
    description: The name of the retail store where the customer made a purchase.
    expr: '"Store Name"'
    data_type: VARCHAR(500)
  primary_key:
    columns:
    - CUSTOMER_RETAIL_STORE_KEY
  description: The table contains records of retail store locations, specifically
    customer-facing stores. Each record includes details about the store's identification,
    location, and operational setup.
